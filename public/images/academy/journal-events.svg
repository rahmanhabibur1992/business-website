<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="e-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1d2028" />
      <stop offset="100%" stop-color="#080a0f" />
    </radialGradient>
    <linearGradient id="gold-e" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2ca50" />
      <stop offset="100%" stop-color="#e1c46e" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#e-bg)" />
  <!-- Simul Hall Layout: Multiple Chess Boards in Horseshoe Array -->
  <g opacity="0.3" stroke="#f2ca50" stroke-width="1.5">
    <!-- Board 1 -->
    <rect x="80" y="200" width="100" height="70" rx="4" fill="#111319" />
    <!-- Board 2 -->
    <rect x="250" y="160" width="100" height="70" rx="4" fill="#111319" stroke="#f2ca50" stroke-width="2" />
    <!-- Board 3 -->
    <rect x="420" y="200" width="100" height="70" rx="4" fill="#111319" />
  </g>
  <!-- Chess Clocks on boards -->
  <rect x="150" y="185" width="24" height="14" rx="2" fill="#272a34" stroke="#9ea3b5" stroke-width="1" />
  <rect x="320" y="145" width="24" height="14" rx="2" fill="#f2ca50" stroke="#f2ca50" stroke-width="1" />
  <rect x="490" y="185" width="24" height="14" rx="2" fill="#272a34" stroke="#9ea3b5" stroke-width="1" />
  <!-- Center Spotlight Figure - Grandmaster walking the simul -->
  <circle cx="300" cy="110" r="45" fill="#f2ca50" opacity="0.15" filter="blur(15px)" />
  <!-- Queen Piece Symbol in Center representing the Simultaneous Master -->
  <g transform="translate(280, 75)" fill="url(#gold-e)">
    <circle cx="5" cy="6" r="2.5" />
    <circle cx="12" cy="4" r="2.5" />
    <circle cx="20" cy="3" r="2.5" />
    <circle cx="28" cy="4" r="2.5" />
    <circle cx="35" cy="6" r="2.5" />
    <path d="M5 12l4 18h22l4-18-8 8-7-12-7 12-8-8z" />
    <path d="M7 33h26" stroke="#f2ca50" stroke-width="2" />
    <path d="M5 38h30" stroke="#f2ca50" stroke-width="2.5" />
  </g>
  <text x="300" y="315" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f2ca50">25 BOARDS • 3 BLINDFOLD</text>
  <text x="300" y="345" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14" fill="#e6e8f2" letter-spacing="1">ANNUAL GRANDMASTER SIMUL EXHIBITION</text>
</svg>