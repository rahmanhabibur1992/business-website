<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="t-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1d2028" />
      <stop offset="100%" stop-color="#080a0f" />
    </radialGradient>
    <linearGradient id="gold-t" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2ca50" />
      <stop offset="100%" stop-color="#e1c46e" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#t-bg)" />
  <!-- Perspective Board -->
  <g opacity="0.15" stroke="#f2ca50" stroke-width="1.5">
    <path d="M50 350 L200 180 L400 180 L550 350 Z" fill="#111319" />
    <path d="M125 265 L475 265" />
    <path d="M150 350 L250 180 M275 350 L325 180 M425 350 L375 180" />
  </g>
  <!-- Trophy & Podium in Center -->
  <g transform="translate(240, 90)">
    <!-- Glow -->
    <circle cx="60" cy="90" r="75" fill="#f2ca50" opacity="0.12" filter="blur(20px)" />
    <!-- Golden Trophy Cup -->
    <path d="M30 40 h60 v40 c0 20 -15 35 -30 35 s-30 -15 -30 -35 Z" fill="url(#gold-t)" />
    <!-- Handles -->
    <path d="M30 45 C15 45 10 65 25 75 C28 77 30 76 30 76" fill="none" stroke="#f2ca50" stroke-width="4" stroke-linecap="round" />
    <path d="M90 45 C105 45 110 65 95 75 C92 77 90 76 90 76" fill="none" stroke="#f2ca50" stroke-width="4" stroke-linecap="round" />
    <!-- Stem and Base -->
    <path d="M52 115 h16 v25 h-16 Z" fill="url(#gold-t)" />
    <path d="M35 140 h50 v16 h-50 Z" fill="#272a34" stroke="#f2ca50" stroke-width="1.5" />
    <!-- Laurel Wreath -->
    <circle cx="60" cy="70" r="8" fill="#080a0f" opacity="0.3" />
    <text x="60" y="75" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#0c0e14">#1</text>
  </g>
  <!-- Chess Rook & Knight Accents -->
  <g transform="translate(140, 220)" fill="#9ea3b5" opacity="0.4">
    <path d="M10 5h4v6h4V5h8v6h4V5h4v9c0 3-2 5-4 6v7h4v4H6v-4h4v-7c-2-1-4-3-4-6V5z" />
    <path d="M8 37h28" stroke="#9ea3b5" stroke-width="2" />
  </g>
  <g transform="translate(420, 220)" fill="url(#gold-t)" opacity="0.75">
    <path d="M14 42h20c-1-5-3-7-6-8 1-3 5-6 5-11 0-6-4-11-11-11-3 0-6 1-8 4l-3 4c-2 2-1 5 2 6l2 1c-2 2-3 5-3 10 0 2 1 4 2 5z" />
  </g>
  <text x="300" y="340" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14" fill="#e6e8f2" letter-spacing="1">STATE YOUTH RAPID • TRIPLE PODIUM</text>
</svg>