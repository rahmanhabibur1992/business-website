<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="levon-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#272a34" />
      <stop offset="60%" stop-color="#161820" />
      <stop offset="100%" stop-color="#0c0e14" />
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2ca50" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>
    <linearGradient id="glow-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2ca50" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f2ca50" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#levon-bg)" />
  <!-- Checkerboard grid subtle overlay in background -->
  <g opacity="0.06" stroke="#f2ca50" stroke-width="1">
    <path d="M100 0v600M200 0v600M300 0v600M400 0v600M500 0v600M600 0v600M700 0v600" />
    <path d="M0 100h800M0 200h800M0 300h800M0 400h800M0 500h800" />
  </g>
  <!-- Halo Glow Behind Coach Silhouette -->
  <circle cx="400" cy="280" r="190" fill="url(#glow-gold)" />
  <!-- Silhouette of Grandmaster Levon Sarkisov -->
  <g fill="#1d2028" stroke="#323542" stroke-width="2">
    <!-- Shoulders and Suit -->
    <path d="M220 540 C 240 430, 290 390, 340 370 L 360 410 L 400 425 L 440 410 L 460 370 C 510 390, 560 430, 580 540 Z" />
    <!-- White Shirt Collar & Gold Tie -->
    <path d="M360 410 L 400 450 L 440 410 L 420 380 L 380 380 Z" fill="#e6e8f2" stroke="none" />
    <path d="M394 425 L 406 425 L 412 510 L 400 530 L 388 510 Z" fill="url(#gold-grad)" stroke="none" />
    <!-- Head & Neck -->
    <path d="M365 375 L 365 325 C 365 320, 360 300, 360 270 C 360 210, 380 180, 400 180 C 420 180, 440 210, 440 270 C 440 300, 435 320, 435 325 L 435 375 Z" fill="#272a34" />
    <!-- Hair & Beard Styling -->
    <path d="M358 250 C 355 200, 380 170, 400 170 C 420 170, 445 200, 442 250 C 442 220, 430 190, 400 190 C 370 190, 358 220, 358 250 Z" fill="#161820" />
    <!-- Spectacles -->
    <circle cx="385" cy="255" r="12" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" />
    <circle cx="415" cy="255" r="12" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" />
    <path d="M397 255 h6" stroke="url(#gold-grad)" stroke-width="2.5" />
    <path d="M373 255 h-10 M427 255 h10" stroke="url(#gold-grad)" stroke-width="2" />
  </g>
  <!-- Foreground Chess King & Board Motif -->
  <g transform="translate(370, 470)" fill="url(#gold-grad)">
    <path d="M30 15v8m-4-4h8" stroke="#f2ca50" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M20 25c4-2 8-2 10 2 2-4 6-4 10-2 3 5 2 13-2 19h-16c-4-6-5-14-2-19z" />
    <path d="M20 48h20" stroke="#f2ca50" stroke-width="2.5" />
    <path d="M16 52h28" stroke="#f2ca50" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="400" y="580" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#9ea3b5" letter-spacing="3">FIDE SENIOR TRAINER • SUPER GM</text>
</svg>